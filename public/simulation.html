<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A1F38">
<title data-i18n="meta.title">ميزان المباشر · محاكاة المنظومة</title>
<meta name="description" data-i18n-attr="content:meta.description" content="محاكاة حيّة لمنظومة ميزان بعد إصدار مرسوم المادة 17 · Q1 2027. اختر شخصيّتك في المنظومة وشاهد ما ستراه أنت.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css?v=9">
<link rel="stylesheet" href="/simulation.css?v=6">
</head>
<body class="sim-body">

<!-- ═══════════ WATERMARK — always visible ═══════════ -->
<div class="sim-watermark" aria-hidden="true">
  <span class="sim-watermark-glyph">◆</span>
  <span data-i18n="sim.watermark"></span>
</div>

<!-- ═══════════ TOP BAR ═══════════ -->
<header class="sim-topbar">
  <a href="/" class="sim-brand">
    <span class="sim-brand-mark">MIZAN</span>
    <span class="sim-brand-live" data-i18n="sim.brand"></span>
  </a>
  <nav class="sim-topbar-actions">
    <div class="sim-clock" id="simClock" aria-live="polite">
      <span class="sim-clock-label" data-i18n="sim.simTime"></span>
      <span class="sim-clock-value" id="simClockValue">Q1 · Day 01 · 06:00</span>
    </div>
    <div class="sim-speed" role="group" aria-label="Simulation speed">
      <span class="sim-speed-label" data-i18n="sim.speed"></span>
      <button class="sim-speed-btn" data-speed="0.25">¼×</button>
      <button class="sim-speed-btn active" data-speed="1">1×</button>
      <button class="sim-speed-btn" data-speed="4">4×</button>
      <button class="sim-speed-btn" data-speed="16">16×</button>
    </div>
    <button class="sim-lang" id="simLang" aria-label="Switch language" title="Switch language">
      <span id="simLangCur">EN</span>
    </button>
    <a href="/" class="sim-back" data-i18n="sim.backToMain"></a>
  </nav>
</header>

<!-- ═══════════ ACT 1 · PERSONA CHOOSER ═══════════ -->
<section class="sim-act sim-act-1 active" id="act1" data-act="1">
  <div class="sim-hero">
    <div class="sim-hero-eyebrow" data-i18n="sim.landing.eyebrow"></div>
    <h1 class="sim-hero-title" data-i18n-html="sim.landing.title"></h1>
    <p class="sim-hero-lede" data-i18n="sim.landing.lede"></p>

    <!-- Compact live activity strip · replaces the previous 3-card block.
         A single-line reading of the currently-operating system. -->
    <div class="sim-activity-strip" role="status" aria-live="polite">
      <div class="sim-act-item"><span class="sim-act-dot"></span><span class="sim-act-num" id="heroTonnes">0</span> <span class="sim-act-lbl" data-i18n="sim.landing.tickerTonnes"></span></div>
      <div class="sim-act-sep">·</div>
      <div class="sim-act-item"><span class="sim-act-num" id="heroEscrow">0</span> <span class="sim-act-lbl" data-i18n="sim.landing.tickerEscrow"></span></div>
      <div class="sim-act-sep">·</div>
      <div class="sim-act-item"><span class="sim-act-num" id="heroCerts">0</span> <span class="sim-act-lbl" data-i18n="sim.landing.tickerCerts"></span></div>
    </div>
  </div>

  <div class="sim-choose">
    <div class="sim-choose-title" data-i18n="sim.landing.pickPersona"></div>
    <div class="sim-persona-grid" id="personaGrid"></div>
  </div>

  <!-- End-to-end story · single transaction · manual step-through controls -->
  <div class="sim-story-e2e" aria-label="End-to-end transaction story">
    <div class="sim-story-e2e-head">
      <span class="sim-story-e2e-eyebrow" data-i18n-html="sim.landing.storyEyebrow"></span>
      <span class="sim-story-e2e-following" id="storyFollowing"></span>
    </div>
    <div class="sim-story-e2e-track" id="storyE2ETrack"></div>
    <div class="sim-e2e-controls">
      <button class="sim-e2e-ctrl-btn" data-e2e-ctrl="prev" data-i18n="sim.e2eCtrl.prev"></button>
      <button class="sim-e2e-ctrl-btn" data-e2e-ctrl="reseed" data-i18n="sim.e2eCtrl.new"></button>
      <button class="sim-e2e-ctrl-btn primary" data-e2e-ctrl="next" data-i18n="sim.e2eCtrl.next"></button>
    </div>
  </div>
</section>

<!-- ═══════════ ACT 2 · PERSONA DASHBOARD ═══════════ -->
<section class="sim-act sim-act-2" id="act2" data-act="2">
  <div class="sim-dash-header">
    <div class="sim-dash-persona">
      <span class="sim-dash-glyph" id="dashGlyph">◈</span>
      <div class="sim-dash-idbox">
        <div class="sim-dash-name" id="dashName"></div>
        <div class="sim-dash-who" id="dashWho"></div>
      </div>
    </div>
    <div class="sim-dash-actions">
      <button class="sim-dash-goto-national" id="gotoNational" data-i18n="sim.national.watchIt"></button>
    </div>
  </div>

  <!-- Escrow ribbon · always visible above every dashboard so the escrow mechanic isn't hidden -->
  <div class="sim-escrow-ribbon" id="escrowRibbon">
    <div class="sim-escrow-title" data-i18n-html="sim.escrow.title"></div>
    <div class="sim-escrow-flow">
      <div class="sim-escrow-side sim-escrow-in">
        <div class="sim-escrow-lbl" data-i18n-html="sim.escrow.inLabel"></div>
        <div class="sim-escrow-val" id="escrowIn">0</div>
      </div>
      <div class="sim-escrow-vault">
        <div class="sim-escrow-vault-glyph">🔒</div>
        <div class="sim-escrow-vault-num" id="escrowHeld">0</div>
        <div class="sim-escrow-vault-lbl" data-i18n-html="sim.escrow.held"></div>
      </div>
      <div class="sim-escrow-side sim-escrow-out">
        <div class="sim-escrow-lbl" data-i18n-html="sim.escrow.outLabel"></div>
        <div class="sim-escrow-val" id="escrowOut">0</div>
      </div>
    </div>
  </div>

  <!-- Story ribbon · single active transaction with manual step-through controls -->
  <div class="sim-story-ribbon" id="storyRibbon">
    <div class="sim-story-ribbon-head">
      <span class="sim-story-ribbon-eyebrow" data-i18n-html="sim.narrative.eyebrow"></span>
      <span class="sim-story-ribbon-what" id="storyRibbonWhat"></span>
    </div>
    <div class="sim-story-ribbon-track" id="storyRibbonTrack"></div>
    <div class="sim-e2e-controls sim-e2e-controls-compact">
      <button class="sim-e2e-ctrl-btn" data-e2e-ctrl="prev" data-i18n="sim.e2eCtrl.prev"></button>
      <button class="sim-e2e-ctrl-btn" data-e2e-ctrl="reseed" data-i18n="sim.e2eCtrl.new"></button>
      <button class="sim-e2e-ctrl-btn primary" data-e2e-ctrl="next" data-i18n="sim.e2eCtrl.next"></button>
    </div>
  </div>

  <div class="sim-dash-body">
    <!-- Left tabs -->
    <aside class="sim-dash-tabs" id="dashTabs" role="tablist"></aside>

    <!-- Center content -->
    <main class="sim-dash-content" id="dashContent"></main>

    <!-- Right rail · "Live around you" — a contextual event stream that shows
         what OTHER personas are doing right now that affects the current one.
         Replaces the earlier static mini-diagram which was purely decorative. -->
    <aside class="sim-dash-pulse">
      <div class="sim-pulse-title" data-i18n="sim.pulse.title"></div>
      <div class="sim-pulse-sub" data-i18n="sim.pulse.sub"></div>
      <div class="sim-pulse-events" id="pulseEvents" aria-live="polite"></div>
      <div class="sim-pulse-jump">
        <div class="sim-pulse-jump-label" data-i18n="sim.pulse.jumpLabel"></div>
        <div class="sim-pulse-jump-grid" id="pulseJumpGrid"></div>
      </div>
    </aside>
  </div>

  <!-- Bottom story track — 5-step progress visual -->
  <div class="sim-story-track" id="storyTrack" role="progressbar" aria-label="Persona story steps"></div>

  <!-- Deep detail card for the currently-active step (populated from persona-story deep entries) -->
  <div class="sim-story-detail" id="storyDetail" role="region" aria-live="polite"></div>
</section>

<!-- ═══════════ ACT 3 · NATIONAL VIEW + DOSSIER ═══════════ -->
<section class="sim-act sim-act-3" id="act3" data-act="3">
  <div class="sim-nat-header">
    <div class="sim-nat-eyebrow" data-i18n="sim.national.eyebrow"></div>
    <h1 class="sim-nat-title" data-i18n="sim.national.title"></h1>
    <p class="sim-nat-lede" data-i18n="sim.national.lede"></p>
  </div>

  <div class="sim-nat-canvas">
    <svg class="sim-nat-svg" id="natSvg" viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="National operating system view"></svg>

    <div class="sim-nat-follow" id="natFollow">
      <button class="sim-follow-btn" id="followBtn" data-i18n="sim.national.follow"></button>
      <span class="sim-follow-hint" data-i18n="sim.national.followHint"></span>
    </div>
  </div>

  <div class="sim-nat-tickers" id="natTickers"></div>

  <div class="sim-nat-actions">
    <button class="sim-dossier-btn" id="dossierBtn" data-i18n="sim.national.dossier"></button>
  </div>
</section>

<!-- ═══════════════════ MOBILE BOTTOM NAVIGATION ═══════════════════
     Fixed-position thumb-reachable action bar · visible only on mobile viewports.
     Prev/Next walk story steps; center buttons open bottom sheets. -->
<nav class="sim-mnav" id="mnavBar" aria-hidden="true">
  <button class="sim-mnav-btn" data-mnav="prev" aria-label="Previous step">
    <span class="sim-mnav-glyph">‹</span>
    <span class="sim-mnav-lbl" data-i18n="sim.mnav.prev"></span>
  </button>
  <button class="sim-mnav-btn" data-mnav="pulse" aria-label="Live around you">
    <span class="sim-mnav-glyph">⚡</span>
    <span class="sim-mnav-lbl" data-i18n="sim.mnav.pulse"></span>
  </button>
  <button class="sim-mnav-btn sim-mnav-center" data-mnav="tabs" aria-label="All tabs">
    <span class="sim-mnav-glyph">◆</span>
    <span class="sim-mnav-lbl" data-i18n="sim.mnav.tabs"></span>
  </button>
  <button class="sim-mnav-btn" data-mnav="escrow" aria-label="Escrow">
    <span class="sim-mnav-glyph">🔒</span>
    <span class="sim-mnav-lbl" data-i18n="sim.mnav.escrow"></span>
  </button>
  <button class="sim-mnav-btn" data-mnav="next" aria-label="Next step">
    <span class="sim-mnav-glyph">›</span>
    <span class="sim-mnav-lbl" data-i18n="sim.mnav.next"></span>
  </button>
</nav>

<!-- ═══════════════════ MOBILE BOTTOM SHEETS ═══════════════════
     Slide up from the bottom · draggable handle · tap-outside to close. -->
<div class="sim-sheet-scrim" id="sheetScrim" aria-hidden="true"></div>

<aside class="sim-sheet" id="pulseSheet" aria-hidden="true" role="dialog">
  <div class="sim-sheet-handle"></div>
  <div class="sim-sheet-head">
    <div class="sim-sheet-title" data-i18n-html="sim.pulse.title"></div>
    <button class="sim-sheet-close" data-sheet-close="pulseSheet" aria-label="Close">×</button>
  </div>
  <div class="sim-sheet-sub" data-i18n="sim.pulse.sub"></div>
  <div class="sim-sheet-body" id="pulseSheetBody"></div>
  <div class="sim-sheet-footer">
    <div class="sim-sheet-jump-label" data-i18n="sim.pulse.jumpLabel"></div>
    <div class="sim-sheet-jump-grid" id="pulseSheetJumps"></div>
  </div>
</aside>

<aside class="sim-sheet" id="escrowSheet" aria-hidden="true" role="dialog">
  <div class="sim-sheet-handle"></div>
  <div class="sim-sheet-head">
    <div class="sim-sheet-title" data-i18n-html="sim.escrow.title"></div>
    <button class="sim-sheet-close" data-sheet-close="escrowSheet" aria-label="Close">×</button>
  </div>
  <div class="sim-sheet-body" id="escrowSheetBody"></div>
</aside>

<aside class="sim-sheet" id="tabsSheet" aria-hidden="true" role="dialog">
  <div class="sim-sheet-handle"></div>
  <div class="sim-sheet-head">
    <div class="sim-sheet-title" data-i18n="sim.mnav.tabsTitle"></div>
    <button class="sim-sheet-close" data-sheet-close="tabsSheet" aria-label="Close">×</button>
  </div>
  <div class="sim-sheet-body" id="tabsSheetBody"></div>
</aside>

<!-- ═══════════ DOSSIER OVERLAY ═══════════ -->
<div class="sim-dossier-overlay" id="dossierOverlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sim-dossier-card">
    <div class="sim-dossier-head">
      <div class="sim-dossier-title" data-i18n="sim.dossier.title"></div>
      <button class="sim-dossier-close" id="dossierClose" aria-label="Close">×</button>
    </div>
    <div class="sim-dossier-sub" data-i18n="sim.dossier.subtitle"></div>
    <div class="sim-dossier-body" id="dossierBody"></div>
    <div class="sim-dossier-actions">
      <button class="sim-dossier-save" id="dossierSave" data-i18n="sim.dossier.save"></button>
      <button class="sim-dossier-copy" id="dossierCopy" data-i18n="sim.dossier.copy"></button>
    </div>
    <div class="sim-dossier-hint" data-i18n="sim.dossier.includeSeed"></div>
  </div>
</div>

<script src="/translations.js?v=13"></script>
<script src="/sim-data.js?v=2"></script>
<script src="/simulation.js?v=6"></script>
</body>
</html>
